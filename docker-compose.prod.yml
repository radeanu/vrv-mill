services:
    nginx:
        image: nginx:stable-alpine
        restart: always
        ports:
            - '80:80'
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - client
            - server

    server:
        ports: !override []
        environment:
            - NODE_ENV=production
            - HOST=0.0.0.0
            - CORS=localhost

    client:
        ports: !override []
        build:
            context: ./client
            dockerfile: Dockerfile
            args:
                - VITE_API_URL=
